<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerador de Ícones PNG - IronPulse</title>
  <style>
    body {
      font-family: sans-serif;
      background: #0b0e14;
      color: #fff;
      padding: 30px;
      text-align: center;
    }
    .preview-box {
      margin: 20px auto;
      display: inline-block;
      padding: 15px;
      background: #151a23;
      border-radius: 16px;
    }
    canvas {
      display: block;
      margin: 0 auto;
      border-radius: 20px;
    }
    button {
      background: #00e676;
      color: #000;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px;
    }
    button:hover { background: #00c853; }
  </style>
</head>
<body>
  <h1>Gerador de Ícones PNG para o IronPulse</h1>
  <p>Abra este arquivo no navegador para salvar os ícones <code>icon-192.png</code> e <code>icon-512.png</code> se desejar.</p>

  <div class="preview-box">
    <canvas id="c512" width="512" height="512"></canvas>
    <br>
    <button onclick="downloadIcon(512, 'icon-512.png')">Baixar icon-512.png</button>
  </div>

  <div class="preview-box">
    <canvas id="c192" width="192" height="192"></canvas>
    <br>
    <button onclick="downloadIcon(192, 'icon-192.png')">Baixar icon-192.png</button>
  </div>

  <script>
    const svgImg = new Image();
    svgImg.onload = () => {
      drawToCanvas('c512', 512);
      drawToCanvas('c192', 192);
    };
    svgImg.src = './icon.svg';

    function drawToCanvas(id, size) {
      const c = document.getElementById(id);
      const ctx = c.getContext('2d');
      ctx.drawImage(svgImg, 0, 0, size, size);
    }

    function downloadIcon(size, filename) {
      const c = document.getElementById('c' + size);
      const a = document.createElement('a');
      a.download = filename;
      a.href = c.toDataURL('image/png');
      a.click();
    }
  </script>
</body>
</html>
